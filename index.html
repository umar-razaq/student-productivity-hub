<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Student Productivity Hub</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-white">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <span class="navbar-brand mb-0 h1">Student Productivity Hub</span>

        <div class="d-flex gap-2">
          <a href="#tasksSection" class="btn btn-light btn-sm">Tasks</a>
          <a href="#habitsSection" class="btn btn-light btn-sm">Habits</a>
          <a href="admin.html" class="btn btn-warning btn-sm">Admin Panel</a>
        </div>
      </div>
    </nav>

    <main>
      <div class="container my-3">
        <div class="alert alert-dark text-center shadow-sm" id="quoteBox">
          Loading motivational quote...
        </div>
      </div>

      <div class="container my-4">
        <div class="row">
          <div class="col-lg-4">
            <div class="card mb-4 shadow-sm">
              <div class="card-body">
                <h3 class="mb-3">Add Task</h3>

                <form id="taskForm">
                  <div class="mb-3">
                    <label class="form-label">Task Title</label>
                    <input type="text" id="title" class="form-control" />
                    <small class="text-danger" id="titleError"></small>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Category</label>
                    <select id="category" class="form-select">
                      <option value="">Choose</option>
                      <option>Study</option>
                      <option>Health</option>
                      <option>Personal</option>
                    </select>
                    <small class="text-danger" id="categoryError"></small>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Priority</label>
                    <select id="priority" class="form-select">
                      <option value="">Choose</option>
                      <option>High</option>
                      <option>Medium</option>
                      <option>Low</option>
                    </select>
                    <small class="text-danger" id="priorityError"></small>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Status</label>
                    <select id="status" class="form-select">
                      <option value="">Choose</option>
                      <option>Pending</option>
                      <option>Completed</option>
                    </select>
                    <small class="text-danger" id="statusError"></small>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Deadline</label>
                    <input type="date" id="deadline" class="form-control" />
                    <small class="text-danger" id="deadlineError"></small>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Description</label>
                    <textarea id="description" class="form-control"></textarea>
                  </div>

                  <button class="btn btn-primary w-100">Add Task</button>
                </form>
              </div>
            </div>

            <div class="card shadow-sm">
              <div class="card-body">
                <h3 class="mb-3">Add Habit</h3>

                <form id="habitForm">
                  <div class="mb-3">
                    <label class="form-label">Habit Name</label>
                    <input type="text" id="habitName" class="form-control" />
                    <small class="text-danger" id="habitNameError"></small>
                  </div>

                  <div class="mb-3">
                    <label class="form-label">Time</label>
                    <select id="habitTime" class="form-select">
                      <option value="">Select Time</option>
                      <option value="Morning">Morning</option>
                      <option value="Afternoon">Afternoon</option>
                      <option value="Night">Night</option>
                    </select>
                    <small class="text-danger" id="habitTimeError"></small>
                  </div>

                  <button class="btn btn-success w-100">Add Habit</button>
                </form>
              </div>
            </div>
          </div>

          <div class="col-lg-8">
            <div class="card mb-4 shadow-sm">
              <div class="card-body">
                <div class="row">
                  <div class="col-md-4">
                    <select id="filterCategory" class="form-select">
                      <option value="">Filter by Category</option>
                      <option>Study</option>
                      <option>Health</option>
                      <option>Personal</option>
                    </select>
                  </div>

                  <div class="col-md-4">
                    <select id="filterPriority" class="form-select">
                      <option value="">Filter by Priority</option>
                      <option>High</option>
                      <option>Medium</option>
                      <option>Low</option>
                    </select>
                  </div>

                  <div class="col-md-4">
                    <select id="filterStatus" class="form-select">
                      <option value="">Filter by Status</option>
                      <option>Pending</option>
                      <option>Completed</option>
                    </select>
                  </div>
                </div>
              </div>
            </div>

            <div id="loading" class="alert alert-info d-none">Loading...</div>
            <div id="error" class="alert alert-danger d-none"></div>

            <section id="tasksSection" class="mt-3">
              <h3>Your Tasks</h3>
              <div class="row" id="taskContainer"></div>
            </section>

            <section id="habitsSection" class="mt-5">
              <h3>Your Habits</h3>
              <div class="row" id="habitContainer"></div>
            </section>
          </div>
        </div>
      </div>
    </main>

    <script src="app.js"></script>
  </body>
</html>
