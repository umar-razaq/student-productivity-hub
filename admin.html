<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Admin Panel</title>

    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.7/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="bg-dark text-white">
    <nav class="navbar navbar-dark bg-black">
      <div class="container">
        <span class="navbar-brand"> Admin Dashboard </span>

        <a href="index.html" class="btn btn-warning"> User Panel </a>
      </div>
    </nav>

    <main>
      <div class="container my-4">
        <div class="row mb-4">
          <div class="col-md-4">
            <div class="card bg-primary text-white">
              <div class="card-body">
                <h4>Total Tasks</h4>
                <h2 id="totalTasks">0</h2>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card bg-success text-white">
              <div class="card-body">
                <h4>Completed</h4>
                <h2 id="completedTasks">0</h2>
              </div>
            </div>
          </div>

          <div class="col-md-4">
            <div class="card bg-danger text-white">
              <div class="card-body">
                <h4>Pending</h4>
                <h2 id="pendingTasks">0</h2>
              </div>
            </div>
          </div>
        </div>

        <div class="row" id="adminTaskContainer"></div>

        <h2 class="mt-5 mb-4 text-warning">Habit Management</h2>

        <div class="row" id="adminHabitContainer"></div>
      </div>
    </main>

    <script src="admin.js"></script>
  </body>
</html>
